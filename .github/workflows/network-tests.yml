name: Network tests

# Tests marked `network` download data from remote servers (NOAA AOML, GRIIDC,
# APDRC, ...). They are deselected in the regular CI so that pull requests are
# not blocked by remote outages; this workflow runs them on a schedule instead
# to detect upstream outages and data format changes.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  network:
    runs-on: ubuntu-latest
    if: github.repository == 'Cloud-Drift/clouddrift'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
      - name: Install the project with plotting extra
        run: uv sync --frozen --extra plotting
      - name: Run network tests
        run: uv run pytest -c pyproject.toml -m network
